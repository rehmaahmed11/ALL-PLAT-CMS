name = "hosting-panel-cms"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# The panel is a single Worker serving many sites by Host header.
workers_dev = true

# First-run install token. Set it before the first deploy with:
#   wrangler secret put PANEL_SETUP_TOKEN
# Until it is set, the panel only accepts install from the same origin it is
# first opened on, and prints a one-time token into the console log.

# ---------------------------------------------------------------------------
# Storage: all free-plan resources. No R2 (needs a card), no paid plans.
# npm run deploy finds or creates D1 and KV by exact name: AMS-HOSTING-PANEL.
# Its predeploy hook pins both IDs; KV titles cannot be set directly in TOML.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "AMS-HOSTING-PANEL"

[[kv_namespaces]]
binding = "KV"

# The bundled CMS Worker template ships with the panel. It is available to the
# Worker through ASSETS, so a fresh deployment can create CMS sites even when
# the repository chosen during setup has no prebuilt template. Worker code runs
# first, so the asset is not publicly served as a panel route.
[assets]
directory = "./templates"
binding = "ASSETS"
run_worker_first = true

# Optional: cron for uptime checks / scheduled publishes / housekeeping.
[triggers]
crons = ["*/10 * * * *"]

# Automatic per-site CMS deployments. Two ways to configure, in priority order:
#   1. Cloudflare API keys in the sidebar: paste the account ID and an API token
#      (Workers Scripts edit, D1 edit, KV edit, account settings read). The token
#      is stored AES-GCM sealed - key in KV, ciphertext in D1 - and the panel also
#      accepts dist/cms-template-worker.js as an upload.
#   2. Worker secrets, preferred for production because nothing is stored in D1:
#        CF_ACCOUNT_ID  -> Worker variable or secret
#        CF_API_TOKEN   -> Worker secret (Workers Scripts, D1, KV edit + account
#                          settings read)
#      CMS_TEMPLATE_URL, when set, pins a custom build; otherwise the bundled
#      ASSETS copy is loaded and cached in KV as cms/template-v1. When KV and
#      ASSETS are empty, the panel tries the configured repository and this
#      panel's published template on GitHub.

# Optional custom domain for the panel itself.
# [[routes]]
# pattern = "panel.example.com"
# custom_domain = true

[observability]
enabled = true
