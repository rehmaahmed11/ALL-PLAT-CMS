name = "edge-cms"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

# Import theme CSS files as text (.html and .sql are text by default).
[[rules]]
type = "Text"
globs = ["**/*.css"]
fallthrough = true

# Scheduled publishing + migrations.
[triggers]
crons = ["*/5 * * * *"]

# --- Bindings -------------------------------------------------------------
# `wrangler deploy` with Wrangler >= 4.45.0 can auto-provision D1 and KV for a
# terminal deploy. Workers Builds (Git) and dashboard deploys need real IDs
# committed here: run `npm run setup:cloudflare` once from a logged-in terminal
# and commit the two lines it inserts. Automatic provisioning in CI writes IDs
# to the build runner's temporary config only, so it cannot fix a Git deploy.
# Never commit placeholder IDs.
#
# Uploaded media is stored in KV, so no R2 bucket (and no payment card) is needed.

[[d1_databases]]
# database_id = "..." # inserted by npm run setup:cloudflare
binding = "DB"
database_name = "edge_cms"

[[kv_namespaces]]
# id = "..." # inserted by npm run setup:cloudflare
binding = "KV"

# Custom domain (optional). The CMS works on workers.dev without this.
# [[routes]]
# pattern = "example.com"
# custom_domain = true

# Theme screenshots ship as packaged files. They are read through the normal
# file store as ArrayBuffers (never imported as text), so the zip upload and the
# PNG in a ZIP export stay byte-for-byte identical.
[[rules]]
type = "Data"
globs = ["**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.webp", "**/*.avif", "**/*.ico"]
fallthrough = true
