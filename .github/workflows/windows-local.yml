name: Windows local preview

on: [push, pull_request]

permissions:
  contents: read

jobs:
  startup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/local-startup.test.mjs
